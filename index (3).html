<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Land Health & Restoration Monitor</title><link rel="icon" href="data:,"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<style>
:root{--bg:#f6f8f3;--card:#fff;--tx:#1d2b1f;--mut:#5d6b60;--pri:#2f7d4f;--bd:#dfe6da;--g:#2e9e5b;--y:#e0a800;--r:#d64545;--b:#3b82d6;--p:#8b5cd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a14;--card:#1b261e;--tx:#e6efe7;--mut:#9db0a1;--bd:#2c3b30}}
:root[data-theme=dark]{--bg:#121a14;--card:#1b261e;--tx:#e6efe7;--mut:#9db0a1;--bd:#2c3b30}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:1100px;margin:auto;padding:14px}h1,h2,h3{margin:.3em 0}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:10px 0}
.hero{background:linear-gradient(135deg,#1f5e3a,#4aa36b);color:#fff;border-radius:16px;padding:34px 20px;text-align:center}.hero h1{font-size:clamp(22px,5vw,36px)}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font:inherit}button.s{background:transparent;color:var(--pri);border:1px solid var(--pri)}.hero button{background:#fff;color:#1f5e3a;margin:4px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}label{font-size:13px;color:var(--mut);display:block;margin-top:8px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0}nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}nav button.on{background:var(--pri);color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.big{font-size:34px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;color:#fff;font-size:12px}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}.sc{overflow-x:auto}
.warn{border-left:5px solid var(--r)}.flow span{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:3px 10px;margin:3px;font-size:13px;color:var(--tx)}
.msg{padding:6px 10px;border-radius:10px;margin:4px 0;max-width:80%}.me{background:var(--pri);color:#fff;margin-left:auto}.ot{background:var(--bd)}
img.th{width:48px;height:36px;object-fit:cover;border-radius:4px}img.pv{max-width:100%;max-height:220px;border-radius:8px}
body{font-family:Poppins,system-ui,sans-serif;background:radial-gradient(at 10% 0,#c4f0d3 0,transparent 45%),radial-gradient(at 95% 8%,#cde3ff 0,transparent 40%),var(--bg);background-attachment:fixed}
:root[data-theme=dark] body,:root:not([data-theme=light]) body{background-blend-mode:normal}
.card{box-shadow:0 6px 22px #1f5e3a1f;transition:.25s;animation:up .5s backwards}.card:hover{transform:translateY(-2px);box-shadow:0 12px 32px #1f5e3a38}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.hero{background:linear-gradient(120deg,#0b4a2c,#2e9e5b,#2a7fd0,#0b4a2c);background-size:300% 300%;animation:mv 12s ease infinite;box-shadow:0 14px 40px #0b4a2c55;padding:54px 20px}.hero h1{letter-spacing:.3px;text-shadow:0 3px 14px #0006}@keyframes mv{50%{background-position:100% 50%}}
.hero button{font-weight:700;box-shadow:0 6px 18px #0004;animation:pl 2.4s infinite}@keyframes pl{50%{transform:scale(1.06)}}
button{background:linear-gradient(135deg,#2e9e5b,#1f7a8c);transition:.2s;font-weight:600}button:hover{transform:translateY(-1px);filter:brightness(1.12)}button.s{background:transparent}nav button.on{background:linear-gradient(135deg,#2e9e5b,#2a7fd0)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;box-shadow:0 4px 16px #0001}
.big{background:linear-gradient(90deg,#2e9e5b,#2a7fd0);-webkit-background-clip:text;background-clip:text}.bar i{transition:width 1s}.bar{height:12px}
.tag{box-shadow:0 2px 8px #0003}.card h3{background:linear-gradient(90deg,var(--pri),#2a7fd0);-webkit-background-clip:text;background-clip:text;color:transparent}
@media print{nav,.top button,.noprint{display:none!important}}
</style></head><body><div class="w" id="app"></div>
<script>
const T={en:{dash:"Dashboard",land:"My Land",analyze:"Analyze",history:"History & Trends",map:"Map",projects:"Restoration",experts:"Experts & Chat",notes:"Notifications",out:"Logout",tag:"Detect. Understand. Restore. Monitor.",start:"Start Analysis",login:"Login / Register"},
hi:{dash:"डैशबोर्ड",land:"मेरी भूमि",analyze:"विश्लेषण",history:"इतिहास व रुझान",map:"नक्शा",projects:"पुनर्स्थापन",experts:"विशेषज्ञ व चैट",notes:"सूचनाएँ",out:"लॉगआउट",tag:"पहचानें। समझें। पुनर्स्थापित करें। निगरानी करें।",start:"विश्लेषण शुरू करें",login:"लॉगिन / पंजीकरण"},
mr:{dash:"डॅशबोर्ड",land:"माझी जमीन",analyze:"विश्लेषण",history:"इतिहास व कल",map:"नकाशा",projects:"पुनर्स्थापना",experts:"तज्ज्ञ व चॅट",notes:"सूचना",out:"लॉगआउट",tag:"ओळखा. समजून घ्या. पुनर्संचयित करा. निरीक्षण करा.",start:"विश्लेषण सुरू करा",login:"लॉगिन / नोंदणी"}};
const ROLES={farmer:"👨‍🌾 Farmer",officer:"🏛️ Agriculture Officer",org:"🌱 Environmental Organization",researcher:"🎓 Researcher / Student",gov:"🏛️ Government Authority",expert:"👨‍🔬 Soil / Environmental Expert",admin:"Admin"};
const NAV={farmer:["dash","land","analyze","history","projects","experts","notes"],officer:["dash","analyze","history","map","projects","experts","notes"],org:["dash","map","history","projects","experts","notes"],researcher:["dash","history","map","experts","notes"],gov:["dash","map","projects","notes"],expert:["dash","experts","notes"],admin:["dash","map","experts","notes"]};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls=h=>h>=70?["Healthy","var(--g)","🟢"]:h>=40?["Moderately Degraded","var(--y)","🟡"]:["Highly Degraded","var(--r)","🔴"];
function seed(){const P=[["LAND-PUNE-001","Shivar North","Pune",18.52,73.85,"@me",[88,74,58]],["LAND-PUNE-002","Orchard Plot","Pune",18.6,73.9,"@me",[80,82,85]],["LAND-NSK-001","Vineyard B","Nashik",20.0,73.79,"Ravi K",[70,66,61]],["LAND-SLP-001","Dry Field","Solapur",17.67,75.9,"Meena P",[45,38,33]],["LAND-KOL-001","River Bank","Kolhapur",16.7,74.24,"Anil D",[90,89,91]],["LAND-NGP-001","Cotton Plot","Nagpur",21.15,79.09,"Sunil T",[60,52,41]]];
const ds=[Date.parse("2026-01-15"),Date.parse("2026-03-15"),Date.parse("2026-05-15")];
return{user:null,lang:"en",plots:P.map(p=>({id:p[0],name:p[1],district:p[2],state:"Maharashtra",lat:p[3],lng:p[4],owner:p[5],type:"Agricultural",crop:"Mixed",area:"2 ha"})),
an:P.flatMap(p=>p[6].map((h,i)=>({plot:p[0],ts:ds[i],health:h,deg:100-h,cls:cls(h)[0],soil:null,soilScore:null,img:null,seed:1}))),
proj:[{plot:"LAND-PUNE-001",progress:55,done:false,ms:[["Soil assessment",2],["Expert consultation",2],["Soil conservation activity",1],["Vegetation restoration",0],["Follow-up analysis",0]],tl:[["January","Problem identified"],["February","Soil test completed"],["March","Expert recommendation received"],["April","Restoration activity started"]]},{plot:"LAND-KOL-001",progress:100,done:true,ms:[["Soil assessment",2],["Vegetation restoration",2]],tl:[["February","Project started"],["August","Improvement detected"]]}],
read:{},chat:[],lastNo:0}}
let S;try{S=JSON.parse(localStorage.getItem("lh2"))}catch(e){}S=S||seed();const save=()=>{try{localStorage.setItem("lh2",JSON.stringify(S))}catch(e){}};
let view="dash",last=null,sel=null,pending=null,cmp=[0,0];const t=k=>(T[S.lang]||T.en)[k]||T.en[k]||k;
const U=()=>S.user,role=()=>U()?.role;
const mine=()=>role()=="farmer"?S.plots.filter(p=>p.owner=="@me"||p.owner==U().name):S.plots;
const ans=id=>S.an.filter(a=>a.plot==id).sort((a,b)=>a.ts-b.ts);
const latest=id=>ans(id).pop();
const pst=id=>{const pr=S.proj.find(x=>x.plot==id);if(pr)return pr.done?["Restoration Completed","var(--p)","🟣"]:["Restoration in Progress","var(--b)","🔵"];const a=latest(id);return a?cls(a.health):["No data","var(--mut)","⚪"]};
const own=p=>role()=="farmer"||role()=="officer"||role()=="admin"?(p.owner=="@me"?U().name:p.owner):"Hidden (privacy)";
const pn=p=>role()=="researcher"?"Plot #"+(S.plots.indexOf(p)+1):p.id;
const fd=ts=>new Date(ts).toLocaleDateString(LC(),{day:"2-digit",month:"short",year:"numeric"});
function warns(){const o=[];mine().forEach(p=>{const a=ans(p.id);if(a.length>1){const mx=Math.max(...a.slice(0,-1).map(x=>x.health)),l=a[a.length-1].health;if(mx-l>=15)o.push({id:"w"+p.id,t:"⚠️ Early warning — "+pn(p),m:`Land health fell: ${mx} → ${l}. Schedule a new soil assessment and consult an agriculture/soil expert.`,p})}
if(a.length&&Date.now()-a[a.length-1].ts>90*864e5)o.push({id:"r"+p.id,t:"📊 Monitoring reminder — "+pn(p),m:"Time for your next land-health assessment."});
if(a.length&&a.every(x=>!x.soil))o.push({id:"s"+p.id,t:"🧪 Soil test reminder — "+pn(p),m:"This land has no measured soil-test data yet."})});
S.chat.filter(c=>c.role==role()).forEach(c=>{if(c.msgs.length>1&&c.msgs[c.msgs.length-1].from!="me")o.push({id:"c"+c.id+c.msgs.length,t:"💬 New message",m:"New reply from "+c.with})});return o}
function chart(pts,col="#2f7d4f"){if(pts.length<1)return"<p class=mut>No data.</p>";const W=500,H=170,x=i=>40+i*(440/Math.max(1,pts.length-1)),y=v=>150-v*1.3;
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><g stroke="#8883" >${[0,50,100].map(v=>`<line x1=40 x2=480 y1=${y(v)} y2=${y(v)}/>`).join("")}</g>${[0,50,100].map(v=>`<text x=4 y=${y(v)+4} font-size=11 fill="#888">${v}</text>`).join("")}<polyline fill=none stroke="${col}" stroke-width=3 points="${pts.map((p,i)=>x(i)+","+y(p[1])).join(" ")}"/>${pts.map((p,i)=>`<circle cx=${x(i)} cy=${y(p[1])} r=4 fill="${col}"/><text x=${x(i)} y=${y(p[1])-9} font-size=11 text-anchor=middle fill="#888">${p[1]}</text><text x=${x(i)} y=167 font-size=10 text-anchor=middle fill="#888">${esc(p[0])}</text>`).join("")}</svg>`}
const bar=(v,c)=>`<div class=bar><i style="width:${v}%;background:${c}"></i></div>`;
// soil
const SP=[["ph","pH",6,7.5,5.5,8],["n","Nitrogen (kg/ha)",280,560,140,700],["p","Phosphorus (kg/ha)",11,25,5,40],["k","Potassium (kg/ha)",120,280,60,400],["mo","Moisture (%)",15,35,8,45],["oc","Organic carbon (%)",.5,.75,.3,1.5],["ec","EC (dS/m)",0,1,0,2]];
function rate(k,v,lo,hi,mn,mx){if(v===""||v==null||isNaN(v))return null;v=+v;let lab=v<lo?"Low":v>hi?"High":"Suitable";let sc=v>=lo&&v<=hi?100:v<lo?Math.max(20,100*(v-mn)/(lo-mn)):Math.max(20,100*(mx-v)/(mx-hi));if(k=="ec"||k=="oc"||k=="n"||k=="p"||k=="k"){if(v>hi&&k!="ec"){lab="High/Adequate";sc=90}if(k=="ec"&&v>hi){lab="Salinity risk"}}return[lab,Math.round(Math.min(100,Math.max(0,sc)))]}
function soilEval(o){const r={};let s=[];SP.forEach(([k,n,lo,hi,mn,mx])=>{const x=rate(k,o[k],lo,hi,mn,mx);r[k]=x;if(x)s.push(x[1])});return{r,score:s.length>=3?Math.round(s.reduce((a,b)=>a+b)/s.length):null,n:s.length}}
// visual analysis
function visual(img){const c=document.createElement("canvas");c.width=c.height=80;const x=c.getContext("2d");x.drawImage(img,0,0,80,80);const d=x.getImageData(0,0,80,80).data;let g=0,b=0,dry=0,n=6400;
for(let i=0;i<d.length;i+=4){const r=d[i],gg=d[i+1],bl=d[i+2];if(gg>r*1.04&&gg>bl*1.08)g++;else if(r>gg*.9&&r>bl*1.1){b++;if(r>150&&gg>110)dry++}}
const veg=g/n,bare=b/n,dr=dry/n;const deg=Math.round(Math.min(100,Math.max(0,100*(.65*(1-Math.min(1,veg/.6))+.35*Math.min(1,bare/.7)))));
const th=document.createElement("canvas");th.width=120;th.height=90;th.getContext("2d").drawImage(img,0,0,120,90);
const lv=v=>v>.5?"High":v>.2?"Moderate":"Low";return{veg,bare,dr,deg,thumb:th.toDataURL("image/jpeg",.6),ind:[["🌿 Vegetation coverage",lv(veg)],["🟤 Exposed soil",lv(bare)],["☀️ Visible dryness",lv(dr*2)],["⚠️ Visible erosion signs",bare>.55&&veg<.15?"Possible":"Not detected"]]}}
// views
function home(){const l=["en","hi","mr"];return`<div class=top><b>🌍 Land Health Monitor</b><select style="width:auto" onchange="setLang(this.value)">${l.map(x=>`<option value=${x} ${S.lang==x?"selected":""}>${{en:"English",hi:"हिंदी",mr:"मराठी"}[x]}</option>`).join("")}</select></div>
<div class=hero><h1>AI-Based Land Health & Degradation Monitoring System</h1><p>${t("tag")}</p><button onclick="document.getElementById('auth').scrollIntoView({behavior:'smooth'})">${t("start")}</button><button onclick="document.getElementById('auth').scrollIntoView({behavior:'smooth'})">${t("login")}</button></div>
<div class=g2><div class=card><h3>What is land degradation?</h3><p>Decline in land's ability to support vegetation and crops, caused by erosion, overgrazing, deforestation, poor irrigation, salinity and drought. It leads to soil fertility loss, vegetation loss, moisture stress and eventually desertification.</p></div><div class=card><h3>Why early detection matters</h3><p>Farmers, agriculture officers, NGOs, researchers and authorities can act before damage becomes costly to reverse — by tracking change over time instead of reacting late.</p></div></div>
<div class=card><h3>How it works</h3><div class=flow>${["Upload / Enter Data","AI & Soil Assessment","Land Health Score","Classification","Explanation","Recommendation","Monitoring","Early Warning","Restoration Tracking"].map(x=>`<span>${x}</span>`).join("→")}</div></div>
<div class=card id=auth><h3>Login / Register</h3><label>Name</label><input id=nm placeholder="Your name"><label>Select your role</label><select id=rl>${Object.entries(ROLES).map(([k,v])=>`<option value=${k}>${v}</option>`).join("")}</select><p class=mut>Prototype: accounts are stored only in this browser (no server). Production use needs real authentication and verification of government/expert roles.</p><button onclick="login()">Continue</button></div>`}
function shell(c){const n=NAV[role()];return`<div class=top><b>🌍 Land Health Monitor</b><span class=mut>${esc(U().name)} · ${ROLES[role()]}</span><span><select style="width:auto" onchange="setLang(this.value)"><option value=en>English</option><option value=hi ${S.lang=="hi"?"selected":""}>हिंदी</option><option value=mr ${S.lang=="mr"?"selected":""}>मराठी</option></select> <button class=s onclick="logout()">${t("out")}</button></span></div><nav>${n.map(k=>`<button class="${view==k?"on":""}" onclick="go('${k}')">${t(k)}${k=="notes"&&warns().filter(w=>!S.read[w.id]).length?" ("+warns().filter(w=>!S.read[w.id]).length+")":""}</button>`).join("")}</nav>${c}`}
function dash(){const P=mine(),L=P.map(p=>({p,a:latest(p.id)})).filter(x=>x.a),c=x=>L.filter(y=>cls(y.a.health)[0]==x).length,avg=L.length?Math.round(L.reduce((s,y)=>s+y.a.health,0)/L.length):"–";
const pr=S.proj.filter(x=>P.some(p=>p.id==x.plot)),W=warns().filter(w=>w.p);
const card=(a,b,col)=>`<div class=card><div class=mut>${a}</div><div class=big style="color:${col||"inherit"}">${b}</div></div>`;
let h=`<h2>${t("dash")}</h2><div class=g>${card("Registered plots",P.length)}${card("Total analyses",P.reduce((s,p)=>s+ans(p.id).length,0))}${card("🟢 Healthy",c("Healthy"),"var(--g)")}${card("🟡 Moderately degraded",c("Moderately Degraded"),"var(--y)")}${card("🔴 Highly degraded",c("Highly Degraded"),"var(--r)")}${card("Average land health",avg)}${card("Active restoration",pr.filter(x=>!x.done).length,"var(--b)")}${card("Completed restoration",pr.filter(x=>x.done).length,"var(--p)")}${card("Early warnings",W.length,W.length?"var(--r)":"")}</div>`;
if(W.length)h+=W.map(w=>`<div class="card warn"><b>${w.t}</b><br>${w.m}</div>`).join("");
const hr=L.filter(y=>y.a.health<40);h+=`<div class=card><h3>High-risk areas</h3>${hr.length?hr.map(y=>`<div>🔴 ${pn(y.p)} — ${y.p.district}, health ${y.a.health}</div>`).join(""):"<span class=mut>None</span>"}</div>`;
if(role()=="gov")h+=`<div class=card><h3>Regional project status</h3><table><tr><th>Total projects<th>Active<th>Completed<th>Delayed</tr><tr><td>${pr.length}<td>${pr.filter(x=>!x.done).length}<td>${pr.filter(x=>x.done).length}<td>0</tr></table></div>`;
return h+`<div class=card><h3>Plots</h3><div class=sc><table><tr><th>Land ID<th>Location<th>Status<th>Health</tr>${P.map(p=>{const a=latest(p.id),s=pst(p.id);return`<tr><td>${pn(p)}<td>${p.district}<td><span class=tag style="background:${s[1]}">${s[0]}</span><td>${a?a.health:"–"}</tr>`}).join("")}</table></div></div>`}
function land(){return`<h2>${t("land")}</h2><div class=card><h3>Register land / plot</h3><div class=g2><div><label>Plot name</label><input id=pnm><label>Village / town + District</label><input id=pds placeholder="e.g. Pune"><label>State</label><input id=pst value="Maharashtra"></div><div><label>Area</label><input id=par placeholder="e.g. 2 ha"><label>Land type</label><select id=pty><option>Agricultural<option>Non-agricultural</select><label>Crop (if any)</label><input id=pcr><label>Coordinates (optional)</label><input id=plt placeholder="lat" style="width:48%"> <input id=pln placeholder="lng" style="width:48%"></div></div><br><button onclick="addPlot()">Create plot & Land ID</button></div>
<div class=card><h3>My plots</h3>${mine().map(p=>`<div>📍 <b>${p.id}</b> — ${esc(p.name)}, ${esc(p.district)}, ${esc(p.state)} · ${esc(p.area)} · ${p.type}</div>`).join("")||"<span class=mut>No plots yet.</span>"}</div>`}
function analyze(){const P=mine();if(!P.length)return`<h2>${t("analyze")}</h2><div class=card>Register a plot first.</div>`;
return`<h2>${t("analyze")}</h2><div class=card><h3>Step 1 — Plot & image</h3><label>Land / plot</label><select id=ap>${P.map(p=>`<option value="${p.id}">${p.id} — ${esc(p.name)}</option>`).join("")}</select><label>Land image (click or drag & drop)</label><input type=file id=af accept="image/*" onchange="prev(this.files[0])" ondragover="event.preventDefault()"><div id=pv style="margin-top:8px"></div></div>
<div class=card><h3>🧪 Soil analysis (measured values, optional)</h3><div class=g>${SP.map(s=>`<div><label>${s[1]}</label><input id="s_${s[0]}" type=number step=any></div>`).join("")}</div><label>Soil lab report (PDF / image, kept as reference)</label><input type=file id=sr accept="image/*,.pdf"><p class=mut>Leave blank if not measured. Sensor-feed integration is planned for a future version.</p></div>
<button onclick="runA()">Analyze Image</button><div id=res>${last?report(last):""}</div>`}
function prev(f){if(!f)return;const r=new FileReader();r.onload=()=>{pending=r.result;$("#pv").innerHTML=`<img class=pv src="${r.result}"> <button class=s onclick="pending=null;$('#pv').innerHTML='';$('#af').value=''">Remove</button>`};r.readAsDataURL(f)}
function runA(){if(!pending)return alert("Please upload a land image first.");const im=new Image();im.onload=()=>{const v=visual(im),o={};SP.forEach(s=>o[s[0]]=$("#s_"+s[0]).value);const se=soilEval(o);const hasSoil=se.score!=null;
const vh=100-v.deg;let health=hasSoil?Math.round(.6*vh+.4*se.score):vh;const id=$("#ap").value;

function tr(){const li=LI();document.documentElement.lang=S.lang;if(!li)return;const root=$("#app"),w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){let v=n.nodeValue;if(!v.trim())continue;for(const d of D)v=d[3]?v.replace(d[3],d[li]):v.split(d[0]).join(d[li]);n.nodeValue=v}
root.querySelectorAll("[placeholder]").forEach(e=>{const d=D.find(x=>x[0]==e.placeholder);if(d)e.placeholder=d[li]})}
function render(){$("#app").innerHTML=U()?shell(V[view]()):home();tr()}
function go(v){view=v;render();scrollTo(0,0)}
function setLang(l){S.lang=l;save();render()}
function login(){const n=$("#nm").value.trim();if(!n)return alert("Please enter your name.");S.user={name:n,role:$("#rl").value};save();view="dash";render()}
function logout(){S.user=null;save();render()}
function addPlot(){const g=i=>$("#"+i).value.trim();if(!g("pnm")||!g("pds"))return alert("Plot name and district are required.");const code=g("pds").slice(0,3).toUpperCase();const n=S.plots.filter(p=>p.id.startsWith("LAND-"+code)).length+1;
S.plots.push({id:`LAND-${code}-${String(n).padStart(3,"0")}`,name:g("pnm"),district:g("pds"),state:g("pst"),area:g("par"),type:g("pty"),crop:g("pcr"),lat:g("plt")||null,lng:g("pln")||null,owner:U().name});save();render()}
function newProj(){const id=$("#np").value;S.proj.push({plot:id,progress:0,done:false,ms:["Soil assessment","Expert consultation","Soil conservation activity","Vegetation restoration","Follow-up analysis"].map(x=>[x,0]),tl:[[new Date().toLocaleString("en",{month:"long"}),"Problem identified"]]});save();render()}
function adv(i,j){const x=S.proj[i],m=x.ms[j];if(m[1]<2){m[1]++;x.tl.push([new Date().toLocaleString("en",{month:"long"}),m[0]+(m[1]==2?" completed":" started")])}x.progress=Math.round(x.ms.reduce((s,m)=>s+m[1],0)/(x.ms.length*2)*100);x.done=x.progress==100;save();render()}
function consult(i){const e=EX[i],p=mine()[0];S.chat.push({id:Date.now(),with:e[0],type:"Consultation: "+e[1],plot:p?.id,msgs:[{from:"me",text:"Hello, I would like guidance on land health for "+(p?.id||"my land")+".",ts:Date.now()}]});save();render()}
function send(i){const v=$("#cm"+i).value.trim();if(!v)return;S.chat[i].msgs.push({from:"me",text:v,ts:Date.now()});save();render()}
